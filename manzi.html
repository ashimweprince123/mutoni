<!DOCTYPE html>
<html>
<head>
    <title>CRUD Bumba</title>

    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin-top: 20px;
        }

        form {
            margin: 20px auto;
            padding: 20px;
            background: #222;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255,255,255,0.1);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button[name="submit"] {
            background: #28a745;
            color: white;
        }

        button[name="update"] {
            background: #007bff;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            background: white;
            color: black;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }

        th {
            background: #333;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        a {
            text-decoration: none;
            margin: 0 5px;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<h2>User CRUD System</h2>

<!-- FORM (connected to PHP later) -->
<form method="POST"action="lavi.php">
    <input type="hidden" name="id">

    <input type="text" name="name" placeholder="Enter Name" required><br>

    <input type="email" name="email" placeholder="Enter Email" required><br>

    <input type="password" name="password" placeholder="Enter Password"><br>
  <button type="submit" name="update">Update</button>

</form>

</body>
</html>
